# Continuous integration: every push to master and every pull request into it runs the shared
# checks, then a dry run of the release packaging. Nothing is published from here.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  # Proves that the site and the release assets can be built, with a placeholder version so no
  # real release is implied. The results are artifacts for inspection, not a deployment.
  package:
    name: Package (dry run)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Download the verified minified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minified-dist
          path: dist

      - name: Assemble the documentation site
        run: node scripts/build-site.mjs

      - name: Package the release assets
        run: node scripts/package-release.mjs 0.0.0-ci

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dry-run
          path: tmp/site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-dry-run
          path: tmp/release/
          if-no-files-found: error
          retention-days: 7
