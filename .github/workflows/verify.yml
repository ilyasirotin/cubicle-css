# The checks every change and every release must pass. Reusable: ci.yml and release.yml call it.
# It mirrors what a contributor runs locally (CONTRIBUTING.md "Checking"): lint, snippets, tokens,
# then the browser matrix on the source and the minified build in all three engines.
name: Verify

on:
  workflow_call:

permissions: {}

jobs:
  verify:
    name: Lint and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install the dev tools
        working-directory: scripts
        run: npm ci

      # The minified files are committed, because jsDelivr serves the repository's files, so they
      # must be what the build produces from the sources. Fails before the long matrix runs.
      - name: Check that the committed minified files are current
        run: |
          bash scripts/build-min.sh
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ differs from a fresh build. Run bash scripts/build-min.sh and commit the result:" >&2
            git status --short -- dist >&2
            exit 1
          fi

      # The browser binaries (about 600 MB) are cached by the lock file, which fixes Playwright's
      # version; --with-deps below still installs the system libraries and fonts through apt.
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/package-lock.json') }}

      # A stalled mirror must fail an attempt, not hang the job for an hour: apt drops a silent
      # connection after 30 s and retries a download, and each whole attempt gets 5 minutes.
      - name: Install the browsers
        working-directory: scripts
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-retries > /dev/null
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "Attempt $attempt to install the browsers failed or timed out." >&2
          done
          exit 1

      - name: Lint
        run: bash scripts/lint.sh

      - name: Check the catalogue snippets
        run: node scripts/check-snippets.mjs

      - name: Check the tokens
        run: node scripts/check-tokens.mjs

      # --min builds dist/*.min.* first (scripts/build-min.sh) and checks both builds. --shots none
      # skips the screenshots, which nothing here keeps.
      - name: Run the browser matrix
        run: node scripts/verify-matrix.mjs --min --shots none

      # The text reports name every failing check with its measured values, so they are kept even
      # when the matrix fails. Screenshots (about 160 MB) are not: they are for a person at a desk,
      # and a Linux run is reproduced locally when a picture is needed.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-reports
          path: tmp/verify/
          if-no-files-found: warn
          retention-days: 14
